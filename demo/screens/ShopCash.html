<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop with cash back</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141210}a:hover{color:#141210}
.sc::-webkit-scrollbar{display:none}
.sc{scrollbar-width:none}
.rise{animation:rise .5s cubic-bezier(.2,.9,.25,1.2) both}
.rise:nth-child(2){animation-delay:.08s}.rise:nth-child(3){animation-delay:.16s}.rise:nth-child(4){animation-delay:.24s}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.cp{transition:background .2s}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;color:#141210;font-family:'DM Sans',sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column">
<div style="background:#DCEBFF;padding:20px 20px 30px;border-radius:0 0 36px 36px;display:flex;flex-direction:column">
<a href="Earn.dc.html" style="align-self:flex-start;display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 14px 0 8px;border-radius:999px;background:#F4F1EE;font-size:13px;font-weight:700;text-decoration:none;color:#141210"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"></path></svg>Earn</a>
<div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:20px">
<div><div style="font-family:'Fraunces',serif;font-size:58px;line-height:1;letter-spacing:-0.03em">Nike</div><div style="font-size:14px;color:#3E5C8E;margin-top:6px">Your most-ordered brand</div></div>
<div style="background:#141210;color:#fff;border-radius:22px;padding:12px 16px;text-align:center;transform:rotate(4deg)"><div style="font-weight:700;font-size:30px;line-height:1">6%</div><div style="font-size:12px;font-weight:700;margin-top:2px">back</div></div>
</div>
</div>
<div style="margin:18px 16px 0;display:flex;gap:12px;align-items:center;border:1.5px solid #EFEBE6;border-radius:22px;padding:12px 16px 12px 12px">
<div style="width:58px;height:72px;border-radius:16px;background:#F3F0EB;flex:none"><img src="/art/shoes-runner-sky.webp" alt="" style="display:block;width:100%;height:100%;object-fit:contain;padding:10%;box-sizing:border-box"></div>
<div style="flex:1"><div style="font-weight:700;font-size:15px">Your next Pegasus, size 10</div><div style="font-size:13px;color:#5E5852;margin-top:2px">$140 means <b style="color:#141210">$8.40 back</b></div></div>
</div>
<div style="padding:24px 20px 0;font-family:'Fraunces',serif;font-size:24px">How to get it</div>
<div style="display:flex;flex-direction:column;gap:12px;padding:12px 20px 0">
<div class="rise" style="display:flex;gap:12px;align-items:center;font-size:15px"><span style="width:30px;height:30px;border-radius:50%;background:#DCEBFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none">1</span>Tap Shop Nike below.</div>
<div class="rise" style="display:flex;gap:12px;align-items:center;font-size:15px"><span style="width:30px;height:30px;border-radius:50%;background:#DCEBFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none">2</span><span style="flex:1">At checkout, use your shopping email.</span></div>
<div class="rise" style="display:flex;gap:12px;align-items:center;font-size:15px"><span style="width:30px;height:30px;border-radius:50%;background:#DCEBFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none">3</span>Your cash back shows up in Earn.</div>
</div>
<button type="button" class="cp" onClick="{{copy}}" style="margin:16px 16px 0;height:52px;border-radius:18px;border:1.5px dashed #9FB8E0;background:{{cpBg}};display:flex;align-items:center;justify-content:space-between;padding:0 16px;font:700 15px 'DM Sans',sans-serif;color:#141210;cursor:pointer"><span>sam@actually.shop</span><span style="font-size:13px;color:#3E5C8E">{{cpLabel}}</span></button>
<div style="flex:1"></div>
<div style="padding:0 16px 24px"><a href="#" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:999px;background:#141210;color:#fff;font-weight:700;font-size:16px;text-decoration:none">Shop Nike</a>
<div style="text-align:center;font-size:12px;color:#7A746D;margin-top:10px">Cash back unlocks after Nike's 60-day return window.</div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { copied: false }; }
  renderVals() {
    const c = this.state.copied;
    return { cpLabel: c ? 'Copied' : 'Copy', cpBg: c ? '#DCEFDF' : '#F4F8FF', copy: () => this.setState({ copied: true }) };
  }
}
</script>
</body>
</html>
