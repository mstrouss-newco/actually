<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reminders</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141210}a:hover{color:#141210}
.ring{animation:ring 2.6s ease-in-out infinite;transform-origin:50% 10%}
@keyframes ring{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(14deg)}80%{transform:rotate(-12deg)}85%{transform:rotate(8deg)}90%{transform:rotate(-5deg)}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;color:#141210;font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;padding:28px 20px 28px">
<div class="ring" style="width:76px;height:76px;border-radius:24px;background:#FFE1DC;display:flex;align-items:center;justify-content:center"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#C9402F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21h4"></path></svg></div>
<h1 style="font-family:'Fraunces',serif;font-weight:400;font-size:42px;line-height:1;letter-spacing:-0.02em;margin:24px 0 0">Never miss a return <em>again.</em></h1>
<p style="font-size:15px;color:#7A746D;margin:12px 0 0;line-height:1.45">We'll nudge you before a window closes. Pick when.</p>
<div style="display:flex;gap:8px;margin-top:22px">
<sc-for list="{{when}}" as="w" hint-placeholder-count="3">
<button type="button" onClick="{{w.pick}}" style="flex:1;height:76px;border-radius:20px;border:2px solid {{w.ring}};background:{{w.bg}};cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;color:#141210">
<span style="font-family:'Fraunces',serif;font-weight:600;font-size:26px;line-height:1">{{w.n}}</span><span style="font-size:12px;font-weight:700">{{w.l}}</span>
</button>
</sc-for>
</div>
<div style="margin-top:22px;display:flex;flex-direction:column;gap:2px">
<sc-for list="{{also}}" as="a" hint-placeholder-count="2">
<button type="button" onClick="{{a.flip}}" style="display:flex;align-items:center;justify-content:space-between;height:60px;border:0;border-bottom:1px solid #EFEBE6;background:transparent;font:inherit;color:#141210;cursor:pointer;padding:0">
<span style="font-size:15px;font-weight:500">{{a.l}}</span>
<span style="width:50px;height:30px;border-radius:999px;background:{{a.track}};position:relative;transition:background .2s"><span style="position:absolute;top:3px;left:{{a.knob}};width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:left .2s"></span></span>
</button>
</sc-for>
</div>
<div style="flex:1"></div>
<a href="Swipe.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:999px;background:#141210;color:#fff;font-weight:700;font-size:16px;text-decoration:none">Turn on reminders</a>
<a href="Swipe.dc.html" style="display:flex;align-items:center;justify-content:center;height:46px;margin-top:6px;font-size:15px;color:#7A746D;text-decoration:none">Not now</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { when: 3, ship: true, deliver: false }; }
  renderVals() {
    const w = this.state.when;
    const tog = (key, l) => ({ l, track: this.state[key] ? '#141210' : '#E2DDD7', knob: this.state[key] ? '23px' : '3px', flip: () => this.setState({ [key]: !this.state[key] }) });
    return {
      when: [[7, 'days before'], [3, 'days before'], [1, 'day before']].map(([n, l]) => ({ n, l, ring: n === w ? '#141210' : '#EFEBE6', bg: n === w ? '#FFE1DC' : '#fff', pick: () => this.setState({ when: n }) })),
      also: [tog('ship', 'When something ships'), tog('deliver', 'When it’s delivered')]
    };
  }
}
</script>
</body>
</html>
