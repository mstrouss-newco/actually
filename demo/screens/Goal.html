<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What you want most</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141210}a:hover{color:#141210}
.opt{transition:transform .25s cubic-bezier(.2,.9,.25,1.3),box-shadow .25s}
.tick{animation:tick .3s cubic-bezier(.2,.9,.25,1.4)}
@keyframes tick{from{transform:scale(.4)}to{transform:none}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;color:#141210;font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;padding:20px 20px 28px">
<a href="Claim.dc.html" style="align-self:flex-start;display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 14px 0 8px;border-radius:999px;background:#F4F1EE;font-size:13px;font-weight:700;text-decoration:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"></path></svg>Back</a>
<h1 style="font-family:'Fraunces',serif;font-weight:400;font-size:40px;line-height:1.02;letter-spacing:-0.02em;margin:26px 0 0">What do you want <em>most?</em></h1>
<p style="font-size:15px;line-height:1.45;color:#7A746D;margin:10px 0 0">Pick any. You get all of it either way. This just decides what you see first.</p>
<div style="display:flex;flex-direction:column;gap:12px;margin-top:24px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
<button type="button" class="opt" onClick="{{o.pick}}" style="display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid {{o.ring}};background:{{o.bg}};border-radius:24px;padding:12px 16px 12px 12px;cursor:pointer;font:inherit;color:#141210;box-shadow:{{o.shadow}}">
<div style="width:64px;height:78px;border-radius:16px;background:#F3F0EB;flex:none;position:relative">
<img src="{{o.img}}" alt="" style="display:block;width:100%;height:100%;object-fit:contain;padding:10%;box-sizing:border-box">
</div>
<div style="flex:1;min-width:0">
<div style="font-family:'Fraunces',serif;font-size:21px;line-height:1.1">{{o.t}}</div>
<div style="font-size:13px;color:#5E5852;margin-top:4px;line-height:1.35">{{o.s}}</div>
</div>
<div style="width:28px;height:28px;border-radius:50%;flex:none;border:2px solid {{o.ring}};background:{{o.dot}};display:flex;align-items:center;justify-content:center">
<sc-if value="{{o.on}}" hint-placeholder-val="{{ true }}"><svg class="tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
</div>
</button>
</sc-for>
</div>
<div style="flex:1"></div>
<a href="Live.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:999px;background:#141210;color:#fff;font-weight:700;font-size:16px;text-decoration:none">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { on: { org: true, earn: false, share: false } }; }
  renderVals() {
    const on = this.state.on;
    const list = [
      { k: 'org', t: 'Keep my orders organized', s: 'Returns, deliveries and sizes, all in one place.', img: '/art/acc-tote-tan.webp', tint: '#FFF6F3' },
      { k: 'earn', t: 'Earn on what I buy', s: 'Cash back at your brands, and points used before they expire.', img: '/art/beauty-lip-oil-rose.webp', tint: '#FFFBEA' },
      { k: 'share', t: 'Share and discover', s: 'Show friends what you love. Find people who shop like you.', img: '/art/tops-cashmere-lilac.webp', tint: '#F7F3FF' }
    ];
    return {
      opts: list.map(o => ({
        ...o, on: on[o.k],
        ring: on[o.k] ? '#141210' : '#EFEBE6',
        bg: on[o.k] ? o.tint : '#fff',
        dot: on[o.k] ? '#141210' : '#fff',
        shadow: on[o.k] ? '0 10px 24px rgba(20,18,16,.10)' : 'none',
        pick: () => this.setState({ on: { ...on, [o.k]: !on[o.k] } })
      }))
    };
  }
}
</script>
</body>
</html>
