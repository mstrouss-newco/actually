<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finding orders</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141210}a:hover{color:#141210}
.row{animation:row .45s cubic-bezier(.2,.9,.25,1.2)}
@keyframes row{from{transform:translateY(-16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.sp{animation:sp 1.2s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;color:#141210;font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;padding:22px 20px 28px;overflow:hidden">
<div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#7A746D">
<sc-if value="{{working}}" hint-placeholder-val="{{ true }}"><svg class="sp" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF6159" stroke-width="3" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-9 9"></path></svg></sc-if>
{{status}}
</div>
<div style="font-family:'Fraunces',serif;font-weight:400;font-size:120px;line-height:.9;letter-spacing:-0.04em;margin-top:18px">{{n}}</div>
<div style="font-size:17px;margin-top:6px">past orders found</div>
<div style="margin-top:18px;height:6px;border-radius:3px;background:#F1EDE8;overflow:hidden"><div style="height:100%;width:{{pct}}%;background:#141210;border-radius:3px;transition:width .2s"></div></div>
<div style="margin-top:24px;font-family:'Fraunces',serif;font-size:22px">Just found</div>
<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px">
<sc-for list="{{found}}" as="f" hint-placeholder-count="4">
<div class="row" style="display:flex;align-items:center;gap:12px;background:#FAF8F6;border-radius:20px;padding:10px 14px 10px 10px">
<div style="width:42px;height:52px;border-radius:12px;background:#F3F0EB;flex:none"><img src="{{f.img}}" alt="" style="display:block;width:100%;height:100%;object-fit:contain;padding:10%;box-sizing:border-box"></div>
<div style="flex:1;font-weight:700;font-size:14px">{{f.t}}</div>
<div style="background:{{f.tagBg}};border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700">{{f.tag}}</div>
</div>
</sc-for>
</div>
<div style="flex:1"></div>
<sc-if value="{{working}}" hint-placeholder-val="{{ true }}"><p style="margin:0 0 14px;font-size:14px;color:#7A746D;line-height:1.45">This keeps going if you leave. We'll tell you when it's done.</p></sc-if>
<a href="Reveal.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:999px;background:#141210;color:#fff;font-weight:700;font-size:16px;text-decoration:none">See my orders</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: 0 }; }
  componentDidMount() {
    this.t = setInterval(() => {
      const n = this.state.n;
      if (n >= 214) { clearInterval(this.t); return; }
      this.setState({ n: Math.min(214, n + 3) });
    }, 70);
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const all = [
      { img: 'https://raw.githubusercontent.com/mstrouss-newco/actually/main/demo-art/shoes-runner-sky.webp', at: 12, t: 'Size 10 at Nike', tag: 'Size', tagBg: '#DCEBFF', bg: '#DCEBFF' },
      { img: 'https://raw.githubusercontent.com/mstrouss-newco/actually/main/demo-art/tops-overshirt-rose.webp', at: 45, t: 'Zara overshirt, return still open', tag: 'Return', tagBg: '#FF6159', bg: '#FFE1DC' },
      { img: 'https://raw.githubusercontent.com/mstrouss-newco/actually/main/demo-art/shoes-sneaker-black-gum.webp', at: 90, t: 'Size 9.5 at Adidas', tag: 'Size', tagBg: '#DCEBFF', bg: '#F1ECE6' },
      { img: 'https://raw.githubusercontent.com/mstrouss-newco/actually/main/demo-art/tops-turtleneck-butter.webp', at: 140, t: 'Aritzia sweater on the way', tag: 'Shipping', tagBg: '#FFF0BF', bg: '#DCEFDF' },
      { img: 'https://raw.githubusercontent.com/mstrouss-newco/actually/main/demo-art/beauty-lip-oil-rose.webp', at: 190, t: 'Sephora points expiring', tag: 'Points', tagBg: '#EBE3FF', bg: '#FFF0BF' }
    ];
    const n = this.state.n;
    return {
      n, pct: Math.round(n / 214 * 100), working: n < 214,
      status: n < 214 ? 'Finding your past orders' : 'All done',
      found: all.filter(f => n >= f.at).reverse().slice(0, 4)
    };
  }
}
</script>
</body>
</html>
