<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My feed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141210}a:hover{color:#141210}
.sc::-webkit-scrollbar{display:none}
.sc{scrollbar-width:none}
.tile{transition:transform .35s cubic-bezier(.2,.9,.25,1.2)}
.tile:hover{transform:translateY(-4px) rotate(-1deg)}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;color:#141210;font-family:'DM Sans',sans-serif;position:relative;overflow:hidden">
<div class="sc" style="height:100%;overflow-y:auto;padding:22px 0 120px;box-sizing:border-box">
<div style="padding:0 20px;display:flex;gap:14px;align-items:baseline;font-family:'Fraunces',serif;white-space:nowrap">
<a href="Friends.dc.html" style="font-size:26px;letter-spacing:-0.02em;line-height:1.15;color:#948C84;text-decoration:none">Friends</a>
<a href="Friends.dc.html" style="font-size:26px;letter-spacing:-0.02em;line-height:1.15;color:#948C84;text-decoration:none">Taste match</a>
<span style="font-size:26px;letter-spacing:-0.02em;line-height:1.15;border-bottom:2px solid #141210">My feed</span>
</div>
<div style="padding:22px 20px 0;display:flex;align-items:center;gap:16px">
<div style="width:76px;height:76px;border-radius:50%;background:#EBE3FF;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:28px;color:#5B44B0;flex:none">SR</div>
<div><div style="font-family:'Fraunces',serif;font-size:28px;line-height:1">Sam Rivera</div><div style="font-size:14px;color:#7A746D;margin-top:4px">112 followers · 48 following</div></div>
</div>
<div style="display:flex;gap:8px;padding:16px 20px 0">
<button type="button" style="flex:1;height:46px;border-radius:999px;border:0;background:#141210;color:#fff;font:700 14px 'DM Sans',sans-serif">Share my feed</button>
<a href="Swipe.dc.html" style="flex:1;height:46px;border-radius:999px;border:1.5px solid #141210;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;text-decoration:none">Sort 5 new purchases</a>
</div>
<div style="padding:24px 20px 0;font-family:'Fraunces',serif;font-size:24px">On your feed</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;padding:16px 16px 0">
<sc-for list="{{items}}" as="p" hint-placeholder-count="4">
<div class="tile" style="display:flex;flex-direction:column;gap:6px">
<div style="aspect-ratio:4/5;border-radius:22px;background:#F3F0EB;position:relative"><img src="{{p.img}}" alt="" style="display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:10%;box-sizing:border-box">
</div>
<div style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7A746D">{{p.brand}}</div>
<div style="font-weight:700;font-size:14px;line-height:1.25">{{p.name}}</div>
<sc-if value="{{p.hasNote}}" hint-placeholder-val="{{ false }}"><div style="font-size:13px;color:#5E5852;font-style:italic;line-height:1.3">"{{p.note}}"</div></sc-if>
<sc-if value="{{p.noNote}}" hint-placeholder-val="{{ false }}"><button type="button" style="align-self:flex-start;border:0;background:transparent;padding:0;font:700 13px 'DM Sans',sans-serif;color:#7A746D;cursor:pointer">+ Add a note</button></sc-if>
</div>
</sc-for>
</div>
</div>
<nav style="position:absolute;z-index:10;left:12px;right:12px;bottom:16px;height:66px;background:#141210;border-radius:30px;display:flex;align-items:center;gap:2px;padding:0 6px;box-shadow:0 12px 30px rgba(20,18,16,.28)">
<a href="Home.dc.html" style="flex:1;height:54px;border-radius:22px;background:transparent;color:#B9B3AC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:11px;font-weight:700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21H3z"></path></svg>Today</a>
<a href="Orders.dc.html" style="flex:1;height:54px;border-radius:22px;background:transparent;color:#B9B3AC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:11px;font-weight:700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v13H3z"></path><path d="M3 7 6 3h12l3 4"></path></svg>Orders</a>
<a href="Closet.dc.html" style="flex:1;height:54px;border-radius:22px;background:transparent;color:#B9B3AC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:11px;font-weight:700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7a2 2 0 1 1 2 2c-1.2.4-2 1-2 2v1"></path><path d="M2.5 19 12 12l9.5 7z"></path></svg>Closet</a>
<a href="Friends.dc.html" style="flex:1;height:54px;border-radius:22px;background:#FFFFFF;color:#141210;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:11px;font-weight:700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20a6 6 0 0 1 12 0"></path><path d="M16 5.5a3.2 3.2 0 0 1 0 6"></path><path d="M18 14.5a5.5 5.5 0 0 1 3 5.5"></path></svg>Feed</a>
<a href="Earn.dc.html" style="flex:1;height:54px;border-radius:22px;background:transparent;color:#B9B3AC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:11px;font-weight:700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"></rect><path d="M12 8v13M3 12.5h18"></path><path d="M12 8C10 4 6 4 6 6.5S12 8 12 8s6-1 6-1.5S14 4 12 8z"></path></svg>Earn</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { share: false }; }
  renderVals() {
    const all = [
      { img: 'https://raw.githubusercontent.com/mstrouss-newco/actually/main/demo-art/shoes-runner-sky.webp', brand: 'Nike', name: 'Pegasus 41', bg: '#DCEBFF', fav: true, note: 'Best running shoe I have owned' },
      { img: 'https://raw.githubusercontent.com/mstrouss-newco/actually/main/demo-art/tops-turtleneck-butter.webp', brand: 'Aritzia', name: 'Ribbed turtleneck', bg: '#FFF0BF', fav: true, note: '' },
      { img: 'https://raw.githubusercontent.com/mstrouss-newco/actually/main/demo-art/dresses-slip-apricot.webp', brand: 'Reformation', name: 'Linen slip dress', bg: '#FFE3CC', fav: true, note: 'Wore it all summer' },
      { img: 'https://raw.githubusercontent.com/mstrouss-newco/actually/main/demo-art/acc-tote-tan.webp', brand: 'Madewell', name: 'Transport tote', bg: '#FFE1DC', fav: false, note: '' },
      { img: 'https://raw.githubusercontent.com/mstrouss-newco/actually/main/demo-art/bottoms-jeans-midwash.webp', brand: 'Levi’s', name: '501 Original', bg: '#DCEFDF', fav: false, note: 'Size down one' },
      { img: 'https://raw.githubusercontent.com/mstrouss-newco/actually/main/demo-art/tops-cashmere-lilac.webp', brand: 'Quince', name: 'Cashmere crew', bg: '#EBE3FF', fav: true, note: '' }
    ].map(p => ({ ...p, hasNote: !!p.note, noNote: !p.note }));
    const on = this.state.share;
    return { items: all,
      styleHint: on ? 'On. People who buy the same brands in your sizes can find your feed.' : 'Off. Only your followers can see your feed.',
      track: on ? '#141210' : '#E2DDD7', knob: on ? '23px' : '3px',
      flip: () => this.setState({ share: !on }) };
  }
}
</script>
</body>
</html>
